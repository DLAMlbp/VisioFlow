name: image-intelligence

x-app: &app
  image: ${API_IMAGE:?API_IMAGE must be a versioned image reference}
  env_file:
    - .env.production
  restart: unless-stopped
  networks:
    - app
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-worker: &worker
  <<: *app
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import os, redis; assert redis.Redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be a versioned image reference}
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    mem_limit: 96m
    cpus: 0.25

  api:
    <<: *app
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE must be a versioned image reference}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Container health is liveness. Deployment gates must call /health/ready
      # separately so a missing AI credential cannot lock users out of settings.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
    mem_limit: 640m
    cpus: 0.75

  worker-control:
    <<: *worker
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE must be a versioned image reference}
    command: celery -A src.workers.celery_app worker -Q control -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: control
    mem_limit: 384m
    cpus: 0.5

  worker-callback:
    <<: *worker
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE must be a versioned image reference}
    command: celery -A src.workers.celery_app worker -Q callback -l info --concurrency=2 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: callback
    mem_limit: 384m
    cpus: 0.5

  worker-preprocess:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q preprocess -l info --concurrency=2 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: preprocess
    mem_limit: 768m
    cpus: 1.0

  worker-classification:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q classification,filtering -l info --concurrency=4 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: classification
    mem_limit: 1280m
    cpus: 2.0

  worker-beautify-plan:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q beautify_plan -l info --concurrency=2 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: beautify_plan
    mem_limit: 768m
    cpus: 1.0

  worker-redaction:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q redaction -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: redaction
    mem_limit: 1536m
    cpus: 1.0

  worker-inpaint:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q inpaint -l info --concurrency=1 --max-tasks-per-child=5 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: inpaint
    mem_limit: 4096m
    cpus: 2.0

  worker-enhance:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q enhance -l info --concurrency=2 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: enhance
    mem_limit: 1280m
    cpus: 1.5

  worker-render:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q render -l info --concurrency=1 --max-tasks-per-child=3 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: render
    mem_limit: 3072m
    cpus: 1.0

  worker-analysis:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q analysis -l info --concurrency=2 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: analysis
    mem_limit: 768m
    cpus: 1.0

  worker-openclip:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q openclip -l info --pool=solo --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: openclip
    mem_limit: 2048m
    cpus: 1.5

  worker-matching:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q matching -l info --concurrency=2 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: matching
    mem_limit: 2048m
    cpus: 1.5

  worker-cleanup:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q cleanup -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: cleanup
    mem_limit: 384m
    cpus: 0.25

  celery-beat:
    <<: *app
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE must be a versioned image reference}
    command: celery -A src.workers.celery_app beat -l info
    environment:
      WORKER_ROLE: beat
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25

  migrate:
    <<: *app
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE must be a versioned image reference}
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    env_file:
      - .env.production
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7.4.5-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app
    volumes:
      - redis-data:/data
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-19001}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file:
      - .env.production
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      mc mb -p local/"$$S3_BUCKET" || true;
      mc anonymous set none local/"$$S3_BUCKET";
      '
    restart: "no"
    networks:
      - app
    mem_limit: 64m
    cpus: 0.25

networks:
  app:

volumes:
  postgres-data:
  minio-data:
  redis-data:
