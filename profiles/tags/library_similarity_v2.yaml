    supporting_concepts: [completed_state]
  材料验收:
    dimension: stage
    fields: [scene, condition, subjects, objects, features, ocr_text]
    keywords: [材料验收, 材料进场, 建材验收]
    required_concepts: [materials]
    supporting_concepts: [inspection]
  主材安装验收:
    dimension: stage
    fields: [scene, condition, subjects, objects, features]
