  space: 0.12
  condition: 0.12
  content_type: 0.10
  view: 0.05
  subjects: 0.12
  objects: 0.12
  ocr_text: 0.12
  attributes: 0.05
  features: 0.05
similarity_auto_threshold: 0.60
similarity_review_threshold: 0.45
similarity_min_margin: 0.00
