name: Test and publish production images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "profiles/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "frontend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Run backend tests in the image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }} \
            sh -c "pip install --no-cache-dir pytest==8.4.2 pytest-asyncio==1.2.0 httpx==0.28.1 && pytest -q"
      - name: Push API image
        run: docker push ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frontend tests
        run: npm ci && npm test && npm run build
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate Nginx configuration
        run: |
          docker run --rm --add-host api:127.0.0.1 -e API_KEY=validation-only \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }} nginx -t
      - name: Push web image
        run: docker push ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }}
