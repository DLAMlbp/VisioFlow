name: Test and publish production images

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "profiles/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "requirements-redaction.txt"
      - "Dockerfile"
      - "models/**"
      - "scripts/fetch_redaction_models.py"
      - "scripts/verify_redaction_supply_chain.py"
      - "scripts/validate_dangjia_dataset.py"
      - "scripts/evaluate_dangjia_logo.py"
      - "training/yolox/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".dockerignore"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      timing-postgres:
        image: pgvector/pgvector:0.8.1-pg16-trixie
        env:
          POSTGRES_DB: throughput_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --memory 384m --cpus 0.5
          --health-cmd "pg_isready -U postgres -d throughput_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      scheduler-redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --memory 64m --cpus 0.25
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate migration graph and production Compose
        run: |
          cp .env.production.example .env.production
          test "$(docker run --rm -v "$PWD:/app" -w /app python:3.12.11-slim-bookworm sh -c "pip install -q alembic==1.16.5 pgvector==0.4.1 && alembic heads | wc -l")" = "1"
          API_IMAGE=ghcr.io/example/api:${{ github.sha }} API_GATEWAY_IMAGE=ghcr.io/example/api:${{ github.sha }} WEB_IMAGE=ghcr.io/example/web:${{ github.sha }} docker compose -f docker-compose.prod.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Run backend tests in the image
        run: |
          docker run --rm --user 0 --network host \
            -e TIME_OPT_TEST_REDIS_URL=redis://127.0.0.1:6379/0 \
            -e PIPELINE_TEST_POSTGRES_URL=postgresql+asyncpg://postgres@127.0.0.1:5432/throughput_test \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -v "$GITHUB_WORKSPACE/frontend:/app/frontend:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/app/scripts:ro" \
            -v "$GITHUB_WORKSPACE/training:/app/training:ro" \
            -v "$GITHUB_WORKSPACE/docker-compose.yml:/app/docker-compose.yml:ro" \
            -v "$GITHUB_WORKSPACE/docker-compose.prod.yml:/app/docker-compose.prod.yml:ro" \
            -v "$GITHUB_WORKSPACE/Dockerfile:/app/Dockerfile:ro" \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }} \
            sh -c "pip install --no-cache-dir pytest==8.4.2 pytest-asyncio==1.2.0 httpx2 psutil==7.0.0 ruff==0.12.12 && ruff check src tests scripts/benchmark_redaction.py scripts/fetch_redaction_models.py scripts/evaluate_dangjia_logo.py scripts/prelabel_dangjia_logo_dataset.py scripts/validate_dangjia_dataset.py scripts/verify_logo_sample_acceptance.py scripts/verify_redaction_supply_chain.py training/yolox/dangjia_logo_nano.py && PYTHONPYCACHEPREFIX=/tmp/pycache python -m py_compile training/yolox/dangjia_logo_nano.py && pytest -q"
      - name: Verify redaction runtime and pinned models
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }} \
            sh -c "python /app/scripts/verify_redaction_supply_chain.py && python -c \"from src.services.images.adapters.rapidocr import _engine; from src.services.images.adapters.lama_opencv import _network; from src.core.config import Settings; from src.services.images.watermark import load_watermark_processor; s=Settings(_env_file=None); _engine(); p=load_watermark_processor(s); _network(str(p.profile_directory / p._manifest['lama_model']))\""
      - name: Verify non-root API runtime
        run: |
          docker run --rm --entrypoint sh \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }} \
            -c 'test "$(id -u)" -ne 0'
      - name: Push API image
        run: docker push ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - name: Run frontend tests
        run: npm ci && npm test && npm run build && npm audit --omit=dev --audit-level=high
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate Nginx configuration
        run: |
          docker run --rm --add-host api:127.0.0.1 -e API_KEY=validation-only \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }} nginx -t
      - name: Push web image
        run: docker push ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }}
