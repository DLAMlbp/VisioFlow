name: Test and publish production images

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "profiles/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "frontend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate migration graph and production Compose
        run: |
          cp .env.production.example .env.production
          test "$(docker run --rm -v "$PWD:/app" -w /app python:3.12.11-slim-bookworm sh -c "pip install -q alembic==1.16.5 && alembic heads | wc -l")" = "1"
          API_IMAGE=ghcr.io/example/api:${{ github.sha }} WEB_IMAGE=ghcr.io/example/web:${{ github.sha }} docker compose -f docker-compose.prod.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Run backend tests in the image
        run: |
          docker run --rm --user 0 \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -v "$GITHUB_WORKSPACE/frontend:/app/frontend:ro" \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }} \
            sh -c "pip install --no-cache-dir pytest==8.4.2 pytest-asyncio==1.2.0 httpx2 ruff==0.12.12 && ruff check src tests && pytest -q"
      - name: Verify non-root API runtime
        run: |
          docker run --rm --entrypoint sh \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }} \
            -c 'test "$(id -u)" -ne 0'
      - name: Push API image
        run: docker push ghcr.io/${{ github.repository_owner }}/tuxiangshibie-api:${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frontend tests
        run: npm ci && npm test && npm run build && npm audit --omit=dev --audit-level=high
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate Nginx configuration
        run: |
          docker run --rm --add-host api:127.0.0.1 -e API_KEY=validation-only \
            ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }} nginx -t
      - name: Push web image
        run: docker push ghcr.io/${{ github.repository_owner }}/tuxiangshibie-web:${{ github.sha }}
