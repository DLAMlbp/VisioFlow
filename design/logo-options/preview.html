<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisioFlow Logo 候选</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f5fa; color: #262633; font-family: "Microsoft YaHei", sans-serif; }
      main { width: 1080px; min-height: 680px; margin: 0 auto; padding: 44px 38px; }
      header { display: flex; align-items: end; justify-content: space-between; border-bottom: 1px solid #dedee8; padding-bottom: 22px; }
      h1 { margin: 0; font-size: 28px; }
      header p { margin: 0 0 3px; color: #747482; font-size: 13px; }
      section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
      article { min-width: 0; border: 1px solid #e2e1e9; border-radius: 8px; background: #fff; padding: 22px 18px 18px; }
      .stage { height: 174px; display: grid; place-items: center; border-radius: 7px; background: #f8f7fc; }
      .stage img { width: 116px; height: 116px; }
      h2 { margin: 18px 0 7px; font-size: 16px; }
      article p { min-height: 42px; margin: 0; color: #727280; font-size: 12px; line-height: 1.7; }
      .micro { display: flex; align-items: center; gap: 10px; border-top: 1px solid #ecebf1; margin-top: 16px; padding-top: 14px; }
      .micro img { width: 42px; height: 42px; filter: drop-shadow(0 7px 12px rgba(79, 57, 180, .18)); }
      .micro strong { font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>VisioFlow Logo 候选</h1>
        <p>放大图形 + 顶栏真实 42px 尺寸</p>
      </header>
      <section>
        <article>
          <div class="stage"><img src="visioflow-option-1-flow-frame.svg" alt="流动相框" /></div>
          <h2>01 流动相框</h2>
          <p>相框、处理路径与输出闪光，直接表达图片进入工作流。</p>
          <div class="micro"><img src="visioflow-option-1-flow-frame.svg" alt="" /><strong>VisioFlow</strong></div>
        </article>
        <article>
          <div class="stage"><img src="visioflow-option-2-v-path.svg" alt="VF 路径字标" /></div>
          <h2>02 V 路径字标</h2>
          <p>用 V 和穿行路径建立专属品牌符号，更像独立软件品牌。</p>
          <div class="micro"><img src="visioflow-option-2-v-path.svg" alt="" /><strong>VisioFlow</strong></div>
        </article>
        <article>
          <div class="stage"><img src="visioflow-option-3-vision-aperture.svg" alt="视觉光圈" /></div>
          <h2>03 视觉光圈</h2>
          <p>延续识别与镜头感，改用流动箭头弱化准星和安防联想。</p>
          <div class="micro"><img src="visioflow-option-3-vision-aperture.svg" alt="" /><strong>VisioFlow</strong></div>
        </article>
        <article>
          <div class="stage"><img src="visioflow-option-4-image-queue.svg" alt="图片队列" /></div>
          <h2>04 图片队列</h2>
          <p>多张图片汇入处理结果，突出批量素材、分类与筛选。</p>
          <div class="micro"><img src="visioflow-option-4-image-queue.svg" alt="" /><strong>VisioFlow</strong></div>
        </article>
      </section>
    </main>
  </body>
</html>
