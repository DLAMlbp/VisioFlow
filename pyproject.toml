[project]
name = "image-intelligence-service"
version = "0.1.0"
description = "Multi-image intelligence filtering, ranking, and natural enhancement service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "boto3>=1.40.0",
  "celery>=5.5.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=5.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "Pillow>=11.3.0",
  "pgvector>=0.4.0",
  "open-clip-torch>=2.26.1",
  "PyYAML>=6.0.0",
  "python-multipart>=0.0.20",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx2>=0.1.0",
  "psutil==7.0.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0"
]
redaction = [
  "onnxruntime>=1.24.0,<2",
  "rapidocr==3.9.2",
  "openvino>=2025.3,<2027"
]
redaction-reference = [
  "remove-ai-watermarks[migan]==0.37.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
