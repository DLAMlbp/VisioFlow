name: image-intelligence

x-worker: &worker
  image: image-intelligence-api:${IMAGE_VERSION:-development}
  build: .
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_started

services:
  web:
    image: image-intelligence-web:${IMAGE_VERSION:-development}
    build: ./frontend
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: image-intelligence-api:${IMAGE_VERSION:-development}
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "18000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Docker health represents process liveness.  The stricter /health/ready
      # endpoint remains available to deployment gates and reports missing AI
      # configuration without preventing access to the configuration UI.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5

  worker-control:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q control -l info --concurrency=1

  worker-preprocess:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q preprocess -l info --concurrency=4

  worker-vision:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q vision -l info --concurrency=4

  worker-classification:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q classification -l info --concurrency=4

  worker-filter:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q filtering -l info --concurrency=4

  worker-beautify-plan:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q beautify_plan -l info --concurrency=4

  worker-enhance:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q enhance -l info --concurrency=2

  worker-analysis:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q analysis -l info --concurrency=1

  worker-embedding:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q embedding -l info --concurrency=1
    environment:
      WORKER_ROLE: embedding

  worker-matching:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q matching -l info --concurrency=2

  worker-library:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q library -l info --concurrency=1

  worker-cleanup:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q cleanup -l info --concurrency=1

  celery-beat:
    <<: *worker
    command: celery -A src.workers.celery_app beat -l info

  migrate:
    image: image-intelligence-api:${IMAGE_VERSION:-development}
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: image_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d image_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175
    ports:
      - "19000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/image-ai || true;
      mc anonymous set none local/image-ai;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
  redis-data:
