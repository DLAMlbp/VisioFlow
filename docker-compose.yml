name: image-intelligence

x-worker: &worker
  image: image-intelligence-api:${IMAGE_VERSION:-development}
  build: .
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_started

services:
  web:
    image: image-intelligence-web:${IMAGE_VERSION:-development}
    build: ./frontend
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: image-intelligence-api:${IMAGE_VERSION:-development}
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "18000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Docker health represents process liveness.  The stricter /health/ready
      # endpoint remains available to deployment gates and reports missing AI
      # configuration without preventing access to the configuration UI.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5

  worker-control:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q control -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: control

  worker-preprocess:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q preprocess -l info --concurrency=4 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: preprocess

  worker-classification:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q classification,filtering -l info --concurrency=4 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: classification

  worker-beautify-plan:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q beautify_plan -l info --concurrency=4 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: beautify_plan

  worker-redaction:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q redaction -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: redaction

  worker-inpaint:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q inpaint -l info --concurrency=1 --max-tasks-per-child=5 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: inpaint

  worker-enhance:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q enhance -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: enhance

  worker-render:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q render -l info --concurrency=1 --max-tasks-per-child=5 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: render

  worker-analysis:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q analysis -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: analysis

  worker-openclip:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q openclip -l info --pool=solo --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: openclip

  worker-matching:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q matching -l info --concurrency=2 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: matching

  worker-cleanup:
    <<: *worker
    command: celery -A src.workers.celery_app worker -Q cleanup -l info --concurrency=1 --without-mingle --without-gossip
    environment:
      WORKER_ROLE: cleanup

  celery-beat:
    <<: *worker
    command: celery -A src.workers.celery_app beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      WORKER_ROLE: beat

  migrate:
    image: image-intelligence-api:${IMAGE_VERSION:-development}
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: harbor.dangjia.com/base/pgvector:0.8.1-pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: image_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d image_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: harbor.dangjia.com/base/redis:7.4.5-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  minio:
    image: harbor.dangjia.com/base/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175}
    ports:
      - "19000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: harbor.dangjia.com/base/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/image-ai || true;
      mc anonymous set none local/image-ai;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
  redis-data:
