services:
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "18000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker-preprocess:
    build: .
    command: celery -A src.workers.celery_app worker -Q preprocess -l info
    env_file:
      - .env
    depends_on:
      - redis

  worker-analysis:
    build: .
    command: celery -A src.workers.celery_app worker -Q analysis -l info
    env_file:
      - .env
    depends_on:
      - redis

  worker-ranking:
    build: .
    command: celery -A src.workers.celery_app worker -Q ranking -l info
    env_file:
      - .env
    depends_on:
      - redis

  worker-enhance:
    build: .
    command: celery -A src.workers.celery_app worker -Q enhance -l info
    env_file:
      - .env
    depends_on:
      - redis

  worker-tagging:
    build: .
    command: celery -A src.workers.celery_app worker -Q tagging -l info
    env_file:
      - .env
    depends_on:
      - redis

  worker-callback:
    build: .
    command: celery -A src.workers.celery_app worker -Q callback -l info
    env_file:
      - .env
    depends_on:
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: image_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5174
    ports:
      - "19000:9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/image-ai || true;
      mc anonymous set none local/image-ai;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
