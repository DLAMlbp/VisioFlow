# Source-mounted production mode. Apply this file after docker-compose.prod.yml.
# The runtime images contain Python dependencies, system packages, models, and
# Nginx. Application-owned files come from an immutable host release directory.

x-source-code: &source-code
  volumes:
    - type: bind
      source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}
      target: /app/release
      read_only: true
    - type: bind
      source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/src
      target: /app/src
      read_only: true
    - type: bind
      source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/profiles
      target: /app/profiles
      read_only: true
    - type: bind
      source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/assets
      target: /app/assets
      read_only: true
    - type: bind
      source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/scripts
      target: /app/scripts
      read_only: true
    - type: bind
      source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/alembic
      target: /app/alembic
      read_only: true
    - type: bind
      source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/alembic.ini
      target: /app/alembic.ini
      read_only: true

services:
  web:
    image: ${WEB_RUNTIME_IMAGE:?WEB_RUNTIME_IMAGE must name a preloaded runtime image}
    volumes:
      - type: bind
        source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/frontend/dist
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: ${SOURCE_RELEASE_ROOT:?SOURCE_RELEASE_ROOT must be an absolute release directory}/frontend/nginx.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true

  api:
    <<: *source-code
    image: ${API_GATEWAY_RUNTIME_IMAGE:-${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}}

  worker-control:
    <<: *source-code
    image: ${API_GATEWAY_RUNTIME_IMAGE:-${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}}

  worker-callback:
    <<: *source-code
    image: ${API_GATEWAY_RUNTIME_IMAGE:-${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}}

  worker-preprocess:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-classification:
    <<: *source-code
    image: ${CLASSIFICATION_RUNTIME_IMAGE:-${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}}

  worker-beautify-plan:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-redaction:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-inpaint:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-enhance:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-render:
    <<: *source-code
    image: ${RENDER_RUNTIME_IMAGE:-${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}}

  worker-analysis:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-openclip:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-library:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-matching:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  worker-cleanup:
    <<: *source-code
    image: ${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}

  celery-beat:
    <<: *source-code
    image: ${API_GATEWAY_RUNTIME_IMAGE:-${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}}

  migrate:
    <<: *source-code
    image: ${API_GATEWAY_RUNTIME_IMAGE:-${API_RUNTIME_IMAGE:?API_RUNTIME_IMAGE must name a preloaded runtime image}}
